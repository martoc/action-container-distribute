---
name: "Distribute a container image"
description: |
  This action copies a container image to multiple registries.
author: martoc
inputs:
  source_registry:
    description: "Source registry"
    required: true
  source_workload_identity_provider:
    description: "Workload Identity Provider"
    required: false
  source_service_account:
    description: "Service Account"
    required: false
  source_region:
    description: |
      Region to push the container to.
      Valid values: Google Cloud or AWS regions.
      Region to push the container to.
      Valid values: google cloud or aws regions
    required: false
    default: ""
  source_gcp_project_id:
    description: "Google Cloud Project ID"
    required: false
    default: ""
  source_aws_role_arn:
    description: "AWS IAM Role ARN for OIDC authentication"
    required: false
    default: ""
  target_registry:
    description: "Target registry"
    required: true
  target_workload_identity_provider:
    description: "Workload Identity Provider"
    required: false
  target_service_account:
    description: "Service Account"
    required: false
  target_region:
    description: "Region to push the container to valid values: google cloud or aws regions"
    required: false
    default: ""
  target_gcp_project_id:
    description: "Google Cloud Project ID"
    required: false
    default: ""
  target_aws_role_arn:
    description: "AWS IAM Role ARN for OIDC authentication"
    required: false
    default: ""
  container_image:
    description: "Container image in the format: [namespace]/[name]:[tag]"
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: 499.0.0
      if: ${{ inputs.source_registry == 'gcp' || inputs.target_registry == 'gcp' }}
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.source_workload_identity_provider }}
        service_account: ${{ inputs.source_service_account }}
      if: ${{ inputs.source_registry == 'gcp' }}
    - name: Pull image from source
      shell: bash
      run: |
        gcloud auth configure-docker --quiet ${{ inputs.source_region }}-docker.pkg.dev
        docker pull ${{ inputs.source_region }}-docker.pkg.dev/${{ inputs.source_gcp_project_id }}/${{ inputs.container_image }}
      if: ${{ inputs.source_registry == 'gcp' }}
    - name: Configure AWS credentials for source
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.source_aws_role_arn }}
        aws-region: ${{ inputs.source_region }}
      if: ${{ inputs.source_registry == 'aws' }}
    - name: Pull image from AWS ECR source
      shell: bash
      run: |
        SOURCE_AWS_ACCOUNT_ID=$(echo "${{ inputs.source_aws_role_arn }}" | cut -d':' -f5)
        if [[ -z "${SOURCE_AWS_ACCOUNT_ID}" ]]; then
          echo "Error: Failed to extract AWS account ID from source_aws_role_arn ('${{ inputs.source_aws_role_arn }}')." >&2
          echo "Please ensure it is a valid IAM role ARN, e.g., arn:aws:iam::<account-id>:role/<role-name>." >&2
          exit 1
        fi
        aws ecr get-login-password --region ${{ inputs.source_region }} | \
          docker login --username AWS --password-stdin "${SOURCE_AWS_ACCOUNT_ID}.dkr.ecr.${{ inputs.source_region }}.amazonaws.com"
        docker pull "${SOURCE_AWS_ACCOUNT_ID}.dkr.ecr.${{ inputs.source_region }}.amazonaws.com/${{ inputs.container_image }}"
      if: ${{ inputs.source_registry == 'aws' }}
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.target_workload_identity_provider }}
        service_account: ${{ inputs.target_service_account }}
      if: ${{ inputs.target_registry == 'gcp' }}
    - name: Push image to GCP target
      shell: bash
      run: |
        gcloud auth configure-docker --quiet ${{ inputs.target_region }}-docker.pkg.dev
        docker tag ${{ inputs.source_region }}-docker.pkg.dev/${{ inputs.source_gcp_project_id }}/${{ inputs.container_image }} \
                   ${{ inputs.target_region }}-docker.pkg.dev/${{ inputs.target_gcp_project_id }}/${{ inputs.container_image }}
        docker push ${{ inputs.target_region }}-docker.pkg.dev/${{ inputs.target_gcp_project_id }}/${{ inputs.container_image }}
      if: ${{ inputs.target_registry == 'gcp' && inputs.source_registry == 'gcp' }}
    - name: Configure AWS credentials for target
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.target_aws_role_arn }}
        aws-region: ${{ inputs.target_region }}
      if: ${{ inputs.target_registry == 'aws' }}
    - name: Push image to AWS ECR target
      shell: bash
      run: |
        # Extract and validate target account ID from role ARN
        TARGET_AWS_ACCOUNT_ID=$(echo "${{ inputs.target_aws_role_arn }}" | cut -d':' -f5)
        if [[ -z "${TARGET_AWS_ACCOUNT_ID}" ]]; then
          echo "Error: Failed to extract AWS account ID from target_aws_role_arn ('${{ inputs.target_aws_role_arn }}')." >&2
          echo "Please ensure it is a valid IAM role ARN, e.g., arn:aws:iam::<account-id>:role/<role-name>." >&2
          exit 1
        fi

        # Login to ECR
        aws ecr get-login-password --region ${{ inputs.target_region }} | \
          docker login --username AWS --password-stdin "${TARGET_AWS_ACCOUNT_ID}.dkr.ecr.${{ inputs.target_region }}.amazonaws.com"

        # Ensure repository exists
        REPO_NAME="${{ inputs.container_image }}"
        REPO_NAME="${REPO_NAME%%:*}"

        # Determine source image based on source registry
        if [[ "${{ inputs.source_registry }}" == "gcp" ]]; then
          SOURCE_IMAGE="${{ inputs.source_region }}-docker.pkg.dev/${{ inputs.source_gcp_project_id }}/${{ inputs.container_image }}"
        elif [[ "${{ inputs.source_registry }}" == "aws" ]]; then
          SOURCE_AWS_ACCOUNT_ID=$(echo "${{ inputs.source_aws_role_arn }}" | cut -d':' -f5)
          SOURCE_IMAGE="${SOURCE_AWS_ACCOUNT_ID}.dkr.ecr.${{ inputs.source_region }}.amazonaws.com/${{ inputs.container_image }}"
        fi

        # Tag and push
        TARGET_IMAGE="${TARGET_AWS_ACCOUNT_ID}.dkr.ecr.${{ inputs.target_region }}.amazonaws.com/${{ inputs.container_image }}"
        docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
        docker push "${TARGET_IMAGE}"
      if: ${{ inputs.target_registry == 'aws' }}
